name: Update scores

# Pulls the latest played matches from openfootball/worldcup.json, commits any
# changes to matches.json, then rebuilds and redeploys the site. No API key
# needed. Runs on a schedule and can be triggered by hand.
on:
  schedule:
    # GitHub runs cron on a best-effort basis and throttles hardest at the top
    # of the hour, so we avoid :00/:30 and schedule several off-peak minutes to
    # raise the chance a run actually fires. Realised cadence is still up to
    # GitHub; use the "Run workflow" button for an immediate update.
    - cron: '7,22,37,52 * * * *' # ~every 15 min, off the busy minutes
  workflow_dispatch:

permissions:
  contents: write # to commit updated scores
  pages: write
  id-token: write

# Share the "pages" group with deploy.yml so deploys never overlap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Fetch latest scores
        run: node scripts/fetch-scores.mjs

      - name: Sync snack days from Google Sheet
        run: node scripts/fetch-snacks.mjs
        env:
          SNACK_SHEET_CSV_URL: ${{ vars.SNACK_SHEET_CSV_URL }}

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/matches.json src/data/fixtures.json src/data/players.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: sync scores & snacks [skip ci]"
            git push
          fi

      - run: npm run build
        env:
          VITE_SNACK_FORM_URL: ${{ vars.VITE_SNACK_FORM_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
